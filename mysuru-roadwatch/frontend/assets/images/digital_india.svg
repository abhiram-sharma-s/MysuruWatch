<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="flagTricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>
  <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <!-- Ashoka Chakra graphic -->
  <circle cx="25" cy="25" r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
  <circle cx="25" cy="25" r="12" fill="none" stroke="#1e3a8a" stroke-width="1" />
  <circle cx="25" cy="25" r="3" fill="#1e3a8a" />
  <!-- Chakra spokes -->
  <line x1="25" y1="13" x2="25" y2="37" stroke="#1e3a8a" stroke-width="1" />
  <line x1="13" y1="25" x2="37" y2="25" stroke="#1e3a8a" stroke-width="1" />
  <line x1="16.5" y1="16.5" x2="33.5" y2="33.5" stroke="#1e3a8a" stroke-width="1" />
  <line x1="16.5" y1="33.5" x2="33.5" y2="16.5" stroke="#1e3a8a" stroke-width="1" />
  <!-- Typography -->
  <text x="48" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="0.5">Digital India</text>
  <text x="48" y="36" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#f59e0b" letter-spacing="0.3">Power To Empower</text>
  <!-- Tricolor Accent Tab on right -->
  <rect x="153" y="10" width="4" height="10" fill="#ff9933" />
  <rect x="153" y="20" width="4" height="10" fill="#ffffff" />
  <rect x="153" y="30" width="4" height="10" fill="#138808" />
</svg>

