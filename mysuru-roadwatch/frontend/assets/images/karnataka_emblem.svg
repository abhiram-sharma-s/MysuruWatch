<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2" />
  
  <!-- Ashoka Lion Capital Motif / Gandaberunda Crest -->
  <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.5">
    <!-- Central Shield Base -->
    <path d="M 60 22 C 72 22 84 28 84 46 C 84 72 60 90 60 90 C 60 90 36 72 36 46 C 36 28 48 22 60 22 Z" fill="#991b1b" stroke="#f59e0b" stroke-width="2" />
    <!-- Gandaberunda Double-Headed Mythical Eagle Motif -->
    <!-- Left Wing -->
    <path d="M 40 45 Q 26 36 28 58 Q 36 64 48 60 Q 42 50 40 45 Z" fill="url(#goldGrad)" />
    <!-- Right Wing -->
    <path d="M 80 45 Q 94 36 92 58 Q 84 64 72 60 Q 78 50 80 45 Z" fill="url(#goldGrad)" />
    <!-- Left Head -->
    <path d="M 52 38 Q 44 32 46 26 Q 54 28 56 36 Z" fill="url(#goldGrad)" />
    <!-- Right Head -->
    <path d="M 68 38 Q 76 32 74 26 Q 66 28 64 36 Z" fill="url(#goldGrad)" />
    <!-- Center Body & Tail -->
    <path d="M 56 36 Q 60 30 64 36 L 66 58 Q 60 76 54 58 Z" fill="url(#goldGrad)" />
    <circle cx="60" cy="48" r="4.5" fill="#fef08a" stroke="#78350f" stroke-width="0.75" />
    <!-- Ashoka Chakra on chest -->
    <circle cx="60" cy="48" r="3" fill="none" stroke="#1e3a8a" stroke-width="0.75" />
  </g>
  
  <!-- Ribbon / Banner at Bottom -->
  <path d="M 30 92 Q 60 99 90 92 L 86 102 Q 60 109 34 102 Z" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="60" y="100" font-family="'Inter', sans-serif" font-size="6.5" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">MYSURU • MCC</text>
  
  <!-- Top Stars -->
  <polygon points="60,10 62,15 67,15 63,18 65,23 60,20 55,23 57,18 53,15 58,15" fill="#f59e0b" />
</svg>

